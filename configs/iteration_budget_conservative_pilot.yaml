#   - v1.0.0 (2026-11-09): 固定低学习率、父AdamW状态与80% D0重放；保持原门禁。
schema: thor-rsi-iteration-budget-v1
phase: P1
primary_task: t00
collection:
  conditions: [t00-standard, t00-lighting, t00-background]
  per_condition: 20
  initial_seed: 63000
  policy_seed: 73000
  max_steps: 520
  action_horizon: 8
  workers: 1
  authority: environment_truth
  require_actual_state_and_seed_isolation: true
generation:
  maximum_windows: 8
  frames_per_window: 93
  batch: 1
  diffusion_steps: 4
  seed: 42
  source: verified_success_only
  background_method: cosmos_mirrored_uv_atlas_sim_rerender
  lighting_admission: required_not_yet_qualified
  allocate_from: current_iteration_independent_feedback
training:
  development_only: true
  steps_per_role: 250
  batch: 8
  seeds: [42]
  roles: [candidate, control, analytic_ablation]
  sample_slots_per_role: 2000
  candidate_quotas: {demo: 1600, self_distill: 200, generated: 200}
  control_quotas: {demo: 1600, duplicate_fill: 400, self_distill: 0, generated: 0}
  absent_qualified_pool: stop_and_report
  same_parent_seed_optimizer_and_steps: true
  optimizer:
    name: adamw
    lr_vlm: 0.000002
    lr_head: 0.00001
    weight_decay: 0.01
    warmup_steps: 20
    restore_parent_state: true
    scheduler: linear_warmup_cosine_min0.1
evaluation:
  definition: eval/frozen_eval_set.json
  sha256: 4b759883c1adbb34b8b974928a29493c471387651648065c0e269fdd5a04e1b8
  workers: 4
  policy_batch: 1
  candidate: {standard: 200, target_perturbed: 800, nontarget_perturbed: 200}
  control: {standard: 200, target_perturbed: 800, nontarget_perturbed: 200}
  incumbent: reuse_same_environment_and_frozen_version_only
  analytic_ablation: diagnostic_budget_declared_separately
promotion:
  min_gain_vs_control: max_0.025_or_2se
  require_gain_vs_incumbent: true
  max_standard_nontarget_drop: max_0.03_or_2se
  max_latency_p95_ratio: 1.2
  human_approval_required: true
  real_robot_enabled: false
  consecutive_accepted_iterations_required: 2
