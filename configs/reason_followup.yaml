# reason_followup.yaml — 首圈完整评测后的判官比较，不改变既有训练、冻结门禁或判官权限。
# @author pony
# @date 2026-11-09
# @version v1.0.0
# @last_modified 2026-11-09
# @changelog
#   - v1.0.0 (2026-11-09): 固定推理提示与独立验证预算，先比较已有反馈，达标才采集新验证集。
schema: thor-reason-followup-v1
judge_config: configs/judge_reasoning_bf16.yaml
rollout_config: configs/rollout_budget.yaml
development: exact_iteration_feedback_only
validation:
  run_only_if_development_passes: true
  conditions: [t00-standard, t00-lighting, t00-background]
  per_condition: 20
  initial_seed: 83000
  policy_seed: 93000
  workers: 1
  use_same_parent_as_development: true
  tune_after_validation: false
authority:
  automatic_judge_permission_change: false
  modify_training_pool: false
  production_promotion: false
  real_robot_enabled: false
